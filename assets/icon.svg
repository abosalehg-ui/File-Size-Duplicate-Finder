<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>File Size Duplicate Finder</title>
  <desc>Application icon: stacked documents with a magnifying glass indicating duplicate detection</desc>

  <defs>
    <!-- Background gradient (blue) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Document gradient -->
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>

    <!-- Lens gradient (orange) -->
    <radialGradient id="lensGradient" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FFB74D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FB8C00" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Glass shine -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGradient)"/>

  <!-- Subtle inner highlight -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>

  <!-- ==================== Back document (duplicate) ==================== -->
  <g transform="translate(280, 200) rotate(-8 220 280)" filter="url(#dropShadow)">
    <!-- Document body -->
    <path d="M 0,40
             Q 0,0 40,0
             L 320,0
             L 440,120
             L 440,520
             Q 440,560 400,560
             L 40,560
             Q 0,560 0,520
             Z"
          fill="url(#docGradient)"/>
    <!-- Folded corner -->
    <path d="M 320,0 L 440,120 L 320,120 Z" fill="#BBDEFB"/>
    <path d="M 320,0 L 320,120 L 440,120" fill="none" stroke="#90CAF9" stroke-width="3"/>

    <!-- Text lines -->
    <rect x="50" y="180" width="340" height="22" rx="11" fill="#90CAF9" opacity="0.7"/>
    <rect x="50" y="230" width="300" height="22" rx="11" fill="#90CAF9" opacity="0.55"/>
    <rect x="50" y="280" width="340" height="22" rx="11" fill="#90CAF9" opacity="0.55"/>
    <rect x="50" y="330" width="260" height="22" rx="11" fill="#90CAF9" opacity="0.4"/>
  </g>

  <!-- ==================== Front document (duplicate) ==================== -->
  <g transform="translate(220, 280) rotate(6 220 280)" filter="url(#dropShadow)">
    <!-- Document body -->
    <path d="M 0,40
             Q 0,0 40,0
             L 320,0
             L 440,120
             L 440,520
             Q 440,560 400,560
             L 40,560
             Q 0,560 0,520
             Z"
          fill="url(#docGradient)"/>
    <!-- Folded corner -->
    <path d="M 320,0 L 440,120 L 320,120 Z" fill="#BBDEFB"/>
    <path d="M 320,0 L 320,120 L 440,120" fill="none" stroke="#64B5F6" stroke-width="3"/>

    <!-- Text lines (same pattern = duplicate) -->
    <rect x="50" y="180" width="340" height="22" rx="11" fill="#42A5F5" opacity="0.85"/>
    <rect x="50" y="230" width="300" height="22" rx="11" fill="#42A5F5" opacity="0.7"/>
    <rect x="50" y="280" width="340" height="22" rx="11" fill="#42A5F5" opacity="0.7"/>
    <rect x="50" y="330" width="260" height="22" rx="11" fill="#42A5F5" opacity="0.55"/>

    <!-- Equals sign (showing match) -->
    <g transform="translate(180, 410)">
      <rect x="0" y="0" width="80" height="14" rx="7" fill="#1565C0"/>
      <rect x="0" y="32" width="80" height="14" rx="7" fill="#1565C0"/>
    </g>
  </g>

  <!-- ==================== Magnifying glass ==================== -->
  <g filter="url(#dropShadow)">
    <!-- Handle (orange) -->
    <g transform="translate(720, 720) rotate(45)">
      <rect x="-25" y="0" width="50" height="220" rx="25" fill="#E65100"/>
      <rect x="-25" y="0" width="50" height="220" rx="25"
            fill="url(#glassShine)" opacity="0.4"/>
    </g>

    <!-- Lens ring (outer) -->
    <circle cx="640" cy="640" r="200" fill="none" stroke="#F57C00" stroke-width="40"/>

    <!-- Lens glass -->
    <circle cx="640" cy="640" r="180" fill="url(#lensGradient)" opacity="0.85"/>

    <!-- Glass shine -->
    <ellipse cx="580" cy="580" rx="80" ry="50"
             fill="#FFFFFF" opacity="0.55" transform="rotate(-30 580 580)"/>

    <!-- Inner highlight -->
    <circle cx="640" cy="640" r="180" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"/>

    <!-- Equals symbol inside lens (showing "match found") -->
    <g transform="translate(580, 615)">
      <rect x="0" y="0" width="120" height="18" rx="9" fill="#BF360C"/>
      <rect x="0" y="38" width="120" height="18" rx="9" fill="#BF360C"/>
    </g>
  </g>

  <!-- Small decorative duplicate indicator dots (top-right) -->
  <g opacity="0.45">
    <circle cx="850" cy="180" r="14" fill="#FFFFFF"/>
    <circle cx="890" cy="220" r="10" fill="#FFFFFF"/>
    <circle cx="820" cy="230" r="8" fill="#FFFFFF"/>
  </g>
</svg>
