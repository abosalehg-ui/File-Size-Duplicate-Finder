name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      # الواجهة تعمل بلا شاشة في الـ CI
      QT_QPA_PLATFORM: offscreen
    steps:
      # الإجراءات مثبّتة بالـ commit SHA لا بالوسم (الوسم قابل للتحريك)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        # مكتبات النظام التي يحتاجها PyQt5 حتى في وضع offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        # PyQt5 مثبّت حتى تعمل اختبارات الواجهة (tests/test_gui_smoke.py)
        # بدل أن تتجاوز نفسها كما كانت
        run: pip install ruff pytest -r requirements.txt
      - name: Lint (ruff)
        run: ruff check finder tests file_size_duplicate_finder.py file_finder_cli.py
      - name: Tests (pytest)
        run: pytest -rs
      - name: GUI tests must not be skipped
        # حارس: لو غاب PyQt5 لاحقاً لسبب ما، يفشل الـ CI بدل أن ينجح صامتاً
        run: python -c "import PyQt5.QtWidgets, send2trash"
