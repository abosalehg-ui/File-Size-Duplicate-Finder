name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check finder tests file_size_duplicate_finder.py file_finder_cli.py
      - name: Tests (pytest)
        # اختبارات المحرك والعمليات والـ CLI لا تحتاج PyQt5
        run: pytest
