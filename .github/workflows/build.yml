name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # الإجراءات مثبّتة بالـ commit SHA لا بالوسم (الوسم قابل للتحريك)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        # إصدارات مقفلة: بناءان من نفس الوسم ينتجان نفس الحزمة
        run: pip install --require-hashes -r requirements-build.txt
      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean --noconfirm
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: FileSizeDuplicateFinder-${{ runner.os }}
          path: dist/
